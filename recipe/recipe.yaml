# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.2"

package:
  name: fps-file-watcher-poll
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fps-file-watcher-poll/fps_file_watcher_poll-${{ version }}.tar.gz
  sha256: ce1c0ed666235a7439bf849ec28872752091cb5197a1007ed967aae383489321

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - anychange >=0.2.0
    - anyio
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-file-watcher >=0.1.0,<0.2.0

tests:
  - python:
      imports:
        - fps_file_watcher_poll
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: An FPS plugin for the file watcher API
  description: An FPS plugin for the file watcher API
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/file_watcher_poll

extra:
  recipe-maintainers:
    - davidbrochart
